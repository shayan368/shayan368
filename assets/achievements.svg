<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 190" width="920" height="190" role="img" aria-label="Achievements" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0072ff"/>
      <stop offset="1" stop-color="#00c6ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2335"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00c6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00c6ff" stop-opacity="0"/>
    </radialGradient>
    <polygon id="star" points="0,-14 3.29,-4.53 13.31,-4.33 5.33,1.73 8.23,11.33 0,5.6 -8.23,11.33 -5.33,1.73 -13.31,-4.33 -3.29,-4.53"/>
  </defs>
  <style>
    .float { animation: float 4s ease-in-out infinite; }
    .glow  { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .star  { animation: twinkle 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ringc { animation: spin 14s linear infinite; transform-box: fill-box; transform-origin: center; }
    .title { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
    .sub   { font: 400 11px 'Segoe UI', Arial, sans-serif; fill: #9aa5ce; }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes pulse   { 0%,100% { opacity: .45; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.1); } }
    @keyframes twinkle { 0%,100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.18); } }
    @keyframes spin    { to { transform: rotate(360deg); } }
  </style>

  <!-- Card 1 -->
  <g class="float" style="animation-delay:0s">
    <rect x="20" y="22" width="168" height="146" rx="14" fill="url(#card)" stroke="#2f3549"/>
    <circle class="glow" cx="104" cy="66" r="34" fill="url(#glow)"/>
    <circle class="ringc" cx="104" cy="66" r="25" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="120 38"/>
    <use class="star" href="#star" x="104" y="66" fill="#00c6ff"/>
    <text class="title" x="104" y="122" text-anchor="middle">BS Software Eng.</text>
    <text class="sub" x="104" y="142" text-anchor="middle">2022 – 2026</text>
  </g>

  <!-- Card 2 -->
  <g class="float" style="animation-delay:.4s">
    <rect x="196" y="22" width="168" height="146" rx="14" fill="url(#card)" stroke="#2f3549"/>
    <circle class="glow" cx="280" cy="66" r="34" fill="url(#glow)" style="animation-delay:.4s"/>
    <circle class="ringc" cx="280" cy="66" r="25" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="120 38"/>
    <use class="star" href="#star" x="280" y="66" fill="#00c6ff" style="animation-delay:.4s"/>
    <text class="title" x="280" y="122" text-anchor="middle">Full Stack Intern</text>
    <text class="sub" x="280" y="142" text-anchor="middle">SMIT · 2026</text>
  </g>

  <!-- Card 3 -->
  <g class="float" style="animation-delay:.8s">
    <rect x="372" y="22" width="168" height="146" rx="14" fill="url(#card)" stroke="#2f3549"/>
    <circle class="glow" cx="456" cy="66" r="34" fill="url(#glow)" style="animation-delay:.8s"/>
    <circle class="ringc" cx="456" cy="66" r="25" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="120 38"/>
    <use class="star" href="#star" x="456" y="66" fill="#00c6ff" style="animation-delay:.8s"/>
    <text class="title" x="456" y="122" text-anchor="middle">Remote Intern</text>
    <text class="sub" x="456" y="142" text-anchor="middle">Software Synergy · 2026</text>
  </g>

  <!-- Card 4 -->
  <g class="float" style="animation-delay:1.2s">
    <rect x="548" y="22" width="168" height="146" rx="14" fill="url(#card)" stroke="#2f3549"/>
    <circle class="glow" cx="632" cy="66" r="34" fill="url(#glow)" style="animation-delay:1.2s"/>
    <circle class="ringc" cx="632" cy="66" r="25" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="120 38"/>
    <use class="star" href="#star" x="632" y="66" fill="#00c6ff" style="animation-delay:1.2s"/>
    <text class="title" x="632" y="122" text-anchor="middle">3 Live Projects</text>
    <text class="sub" x="632" y="142" text-anchor="middle">Deployed on Vercel</text>
  </g>

  <!-- Card 5 -->
  <g class="float" style="animation-delay:1.6s">
    <rect x="724" y="22" width="168" height="146" rx="14" fill="url(#card)" stroke="#2f3549"/>
    <circle class="glow" cx="808" cy="66" r="34" fill="url(#glow)" style="animation-delay:1.6s"/>
    <circle class="ringc" cx="808" cy="66" r="25" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="120 38"/>
    <use class="star" href="#star" x="808" y="66" fill="#00c6ff" style="animation-delay:1.6s"/>
    <text class="title" x="808" y="122" text-anchor="middle">MERN Stack</text>
    <text class="sub" x="808" y="142" text-anchor="middle">React · Node · MongoDB</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
